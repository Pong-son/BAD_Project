    <div class="modal fade" tabindex="-1" id="loginModal" aria-labelledby="loginModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header bg-primary">
            <h5 class="modal-title" id="loginModalLabel">Login Testing</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form action="/login" method="post" id="loginForm">
              <div class="input-group mb-3">
                <span class="input-group-text">Username</span>
                <input type="text" name="userName" id="userName" class="form-control" aria-label="username"/>
              </div>
              <div class="input-group mb-3"">
                <span class="input-group-text">Password</span>
                <input type="password" name="passWord" id="passWord" class="form-control" aria-label="Password"/>
                <span class="input-group-text material-symbols-outlined" id="pw_visibility">
                    visibility
                </span>
              </div>
              <br />
              <button type="submit" data-bs-dismiss="modal">Login</button>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>

						<span class="input-group-text material-symbols-outlined" id="main_pw_visibility">
								visibility
						</span>
					</div>
					<br />
					<button type="submit" data-bs-dismiss="modal">Login</button>
				</form>
			</div>
