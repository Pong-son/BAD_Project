<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reporting System</title>
  <link rel="stylesheet" href="index.css" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
    crossorigin="anonymous"
  />
</head>
<body>
  <div  id="mainContent" class="container-fluid">
    <div id="navBar"></div>
    <div class="row">
      <div id="page_title">
        <div id="search_bar" class="d-flex" role="search">
          <div class="input-group">
            <input id="searchItem" class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
            <button id="refreshBtn" class="btn btn-success" style="display: flex; align-items: center;">
              <span class="material-symbols-outlined" style="color:'white';">refresh</span>
            </button>
          </div>
        </div>
      </div>
      <div class="table-responsive-md">
        <table class="table table-bordered table-hover table-striped" >
          <thead>
            <tr>
              <th scope="col" data-th="id"><span data-th="id">id</span><span class="material-symbols-outlined" data-th="id" data-arrow="id">arrow_downward</span></th>
              <th scope="col" data-th="name"><span data-th="name">Name</span><span class="material-symbols-outlined" data-th="name" data-arrow="name"></span></th>
              <th scope="col" data-th="calibrationDate"><span data-th="calibrationDate">Calibration Date</span><span class="material-symbols-outlined" data-th="calibrationDate" data-arrow="calibrationDate"></span></th>
              <th scope="col" data-th="expiryDate"><span data-th="expiryDate">Expiry Date</span><span class="material-symbols-outlined" data-th="expiryDate" data-arrow="expiryDate"></span></th>
              <th scope="col">Delete</th>
            </tr>
          </thead>
          <tbody class="table-group-divider" id="historyTable"></tbody>
        </table>
      </div>
      <div style="display:flex; position: relative; bottom: 0px; ">
        <nav aria-label="Page navigation example">
          <ul class="pagination">
            <li class="page-item">
              <a class="page-link" aria-label="Previous" data-pre>
                <span aria-hidden="true">&laquo;</span>
              </a>
            </li>
            <span id="pageController"></span>
            <li class="page-item">
              <a class="page-link" aria-label="Next">
                <span aria-hidden="true">&raquo;</span>
              </a>
            </li>
          </ul>
        </nav>
        <div class="input-group" style="height: 37.6px; margin-left: 25px; max-width: 230px;">
          <span class="input-group-text" >Show on each page</span>
          <input class="form-control" style="height: 37.6px;"  type="number" name="itemPerPage" id="itemPerPage" value="10" min="1" max="100">
        </div>
      </div>
    </div>
  </div>
  <script
  src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
  integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
  crossorigin="anonymous"
></script>
<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
  integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
  crossorigin="anonymous"
></script>
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/icon?family=Material+Icons"
/>
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
/>
<script type="module" src="./index.js"></script>
</body>
</html>
